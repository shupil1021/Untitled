# 수동 실행 전용(Actions 탭 → Build binaries → Run workflow) — 태그/푸시에는 자동으로 돌지 않는다.
# version 을 적으면(예: 0.4.1) 세 플랫폼 실행 파일을 zip 하나(Untitled-v버전.zip)로 묶어 GitHub Release 로 올린다.
name: Build binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전(예: 0.4.1). 비우면 빌드만 하고 릴리스는 안 만든다"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Untitled-windows.exe
            bin: crackhead.exe
          - os: ubuntu-latest
            artifact: Untitled-linux
            bin: crackhead
          - os: macos-latest
            artifact: Untitled-macos
            bin: crackhead
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin crackhead
      - name: Rename
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.artifact }}"
      - name: Smoke test (macOS) — 10초 동안 켜 두고 죽는지 본다
        if: runner.os == 'macOS'
        run: |
          RUST_BACKTRACE=1 ./"${{ matrix.artifact }}" > smoke.log 2>&1 &
          pid=$!
          sleep 10
          if kill -0 $pid 2>/dev/null; then echo "still running after 10s"; kill $pid; cat smoke.log; else code=0; wait $pid || code=$?; echo "EXITED with $code"; cat smoke.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: ${{ inputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: Zip executables only
        run: |
          chmod +x bin/Untitled-linux bin/Untitled-macos
          cd bin && zip "../Untitled-v${{ inputs.version }}.zip" Untitled-windows.exe Untitled-linux Untitled-macos
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## v${{ inputs.version }} /{f=1;next} /^## v/{f=0} f' CHANGELOG.md)
          gh release create "v${{ inputs.version }}" "Untitled-v${{ inputs.version }}.zip"             --target "${{ github.sha }}" --title "Untitled v${{ inputs.version }}" --notes "$notes"
