# 수동 실행 전용(Actions 탭 → Build binaries → Run workflow) — 태그/푸시에는 자동으로 돌지 않는다.
# version 을 적으면(예: 0.4.1) 세 플랫폼 실행 파일을 zip 하나(Untitled-v버전.zip)로 묶어 GitHub Release 로 올린다.
name: Build binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전(예: 0.4.1). 비우면 빌드만 하고 릴리스는 안 만든다"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Untitled-windows.exe
            bin: crackhead.exe
          - os: ubuntu-latest
            artifact: Untitled-linux
            bin: crackhead
          - os: macos-latest
            artifact: Untitled-macos
            bin: crackhead
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --bin crackhead
      - name: Rename
        shell: bash
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.artifact }}"
      - name: Make BlackOut.app (macOS) — 맥에서 더블클릭으로 열리는 앱 번들 + 임시(ad-hoc) 서명
        if: runner.os == 'macOS'
        run: |
          mkdir -p BlackOut.app/Contents/MacOS
          cp "${{ matrix.artifact }}" BlackOut.app/Contents/MacOS/BlackOut
          chmod +x BlackOut.app/Contents/MacOS/BlackOut
          cat > BlackOut.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>BlackOut</string>
            <key>CFBundleDisplayName</key><string>BlackOut</string>
            <key>CFBundleIdentifier</key><string>com.shupil1021.blackout</string>
            <key>CFBundleExecutable</key><string>BlackOut</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>${{ inputs.version }}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - BlackOut.app
          codesign --verify --verbose BlackOut.app
          tar -cf BlackOut-macos.tar BlackOut.app
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: BlackOut-macos.tar
          path: BlackOut-macos.tar
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: ${{ inputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: Zip executables only
        run: |
          chmod +x bin/Untitled-linux
          cd bin && tar -xf BlackOut-macos.tar
          zip -r -y "../Untitled-v${{ inputs.version }}.zip" Untitled-windows.exe Untitled-linux BlackOut.app
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## v${{ inputs.version }} /{f=1;next} /^## v/{f=0} f' CHANGELOG.md)
          gh release create "v${{ inputs.version }}" "Untitled-v${{ inputs.version }}.zip"             --target "${{ github.sha }}" --title "Untitled v${{ inputs.version }}" --notes "$notes"
