# v 로 시작하는 태그(예: v0.1.0)를 올리면 윈도우에서 릴리스 빌드를 해서 GitHub Releases 에
# Untitled-<태그>-windows.zip 을 자동으로 올린다. 릴리스는 이 워크플로우가 GitHub 토큰으로
# 직접 만들기 때문에 개인 토큰이 따로 필요 없다.
#
# 쓰는 법:  git tag v0.1.0  →  git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --lib

      - name: Build
        run: cargo build --release --bin crackhead

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/crackhead.exe dist/Untitled.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath "Untitled-${{ github.ref_name }}-windows.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: Untitled-*-windows.zip
          generate_release_notes: true
